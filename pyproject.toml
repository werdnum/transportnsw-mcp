[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transportnsw-mcp"
version = "0.1.0"
description = "MCP server for Transport NSW API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.4.1,<2",
    "python-dateutil>=2.5.3",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "tzdata>=2024.1",
]

[project.scripts]
transportnsw-mcp = "api:main"

[tool.hatch.build.targets.wheel]
include = ["api.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
